<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Winkler Soup Party 2026 — Saturday, November 14th, at the Winkler Haus. Bring a soup and an appetite.">
  <title>Winkler Soup Party 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #fdf6ec;
      --tomato: #c0392b;
      --herb: #5b7f3a;
      --ink: #3b2f2a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: var(--cream);
      color: var(--ink);
      font-family: "Inter", system-ui, sans-serif;
    }

    main {
      text-align: center;
      max-width: 600px;
      animation: fade-in 1.2s ease-out both;
    }

    .emoji {
      font-size: 3rem;
      margin: 0;
    }

    h1 {
      font-family: "Playfair Display", Georgia, serif;
      color: var(--tomato);
      font-size: clamp(2.25rem, 7vw, 4rem);
      line-height: 1.1;
      margin: 0.5rem 0 1.5rem;
    }

    .date {
      display: inline-block;
      border: 2px solid var(--herb);
      border-radius: 999px;
      padding: 0.6rem 1.5rem;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--herb);
      margin: 0;
    }

    .details {
      margin: 1rem 0 0;
      font-size: 1.1rem;
    }

    .tagline {
      margin-top: 1.5rem;
      font-size: 1rem;
      opacity: 0.75;
    }

    @keyframes fade-in {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main>
    <p class="emoji" aria-hidden="true">🍲</p>
    <h1>Winkler Soup Party 2026</h1>
    <p class="date">Saturday, November 14th</p>
    <p class="details">At the Winkler Haus</p>
    <p class="tagline">Bring a soup and an appetite.</p>
  </main>
</body>
</html>
